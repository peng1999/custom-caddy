name: Build and publish Caddy
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: caddy-release
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-24.04
    if: github.ref == 'refs/heads/main'
    outputs:
      version: ${{ steps.release.outputs.version }}
      tag: ${{ steps.release.outputs.tag }}
      package_version: ${{ steps.release.outputs.package_version }}
      build: ${{ steps.release.outputs.build }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: release
        run: python3 scripts/prepare-release.py
        env:
          GH_TOKEN: ${{ github.token }}

  build:
    needs: prepare
    if: needs.prepare.outputs.build == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable
          cache: false
      - name: Build and package native binary
        run: scripts/build.sh "$UPSTREAM_VERSION" "$PACKAGE_VERSION" "$BUILD_ARCH"
        env:
          BUILD_ARCH: ${{ matrix.arch }}
          GH_TOKEN: ${{ github.token }}
          UPSTREAM_VERSION: ${{ needs.prepare.outputs.version }}
          PACKAGE_VERSION: ${{ needs.prepare.outputs.package_version }}
      - name: Test official-to-custom upgrades on Debian and Ubuntu
        run: |
          for image in debian:bookworm-slim ubuntu:24.04; do
            docker run --rm -v "$PWD/dist:/dist:ro" -v "$PWD/work/upstream:/upstream:ro" \
              -v "$PWD/tests:/tests:ro" -v "$PWD/scripts:/scripts:ro" \
              "$image" bash /scripts/test-package.sh
          done
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: packages-${{ matrix.arch }}
          path: dist/
          retention-days: 3
          if-no-files-found: error

  publish:
    needs: [prepare, build]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: packages-*
          merge-multiple: true
          path: dist
      - name: Verify artifacts and restore retained packages
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          (cd dist && for sums in SHA256SUMS_*; do sha256sum --check "$sums"; done)
          (cd dist && cat SHA256SUMS_* | sort -u > SHA256SUMS)
          python3 scripts/restore-packages.py "$RELEASE_TAG"
          if ! command -v apt-ftparchive; then
            sudo scripts/install-test-deps.sh apt-utils
          fi
      - name: Sign APT repository
        env:
          APT_SIGNING_KEY: ${{ secrets.APT_SIGNING_KEY }}
        run: |
          export GNUPGHOME
          GNUPGHOME=$(mktemp -d)
          chmod 700 "$GNUPGHOME"
          trap 'gpgconf --kill gpg-agent; rm -rf "$GNUPGHOME"' EXIT
          test -n "$APT_SIGNING_KEY"
          printf '%s' "$APT_SIGNING_KEY" | gpg --batch --import
          scripts/assemble-repo.sh site
      - name: Test signed APT installation
        run: |
          for image in debian:bookworm-slim ubuntu:24.04; do
            docker run --rm -v "$PWD/site:/repo:ro" -v "$PWD/scripts:/scripts:ro" \
              "$image" bash /scripts/test-apt.sh
          done
      - name: Stage immutable release assets
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
          UPSTREAM_VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          # Existing drafts are safe to resume after a failed publication.
          if ! gh release view "$RELEASE_TAG" --json isDraft > work-release.json 2>/dev/null; then
            printf 'Caddy %s with pinned Cloudflare DNS and Dynamic DNS plugins.\n\nSee manifest.json, build-info files and source archives for the exact build inputs.\n' "$UPSTREAM_VERSION" > release-notes.txt
            gh release create "$RELEASE_TAG" --draft --target "$GITHUB_SHA" \
              --title "$RELEASE_TAG" --notes-file release-notes.txt
          else
            python3 -c 'import json; assert json.load(open("work-release.json"))["isDraft"], "Refusing to overwrite a published release"'
          fi
          gh release upload "$RELEASE_TAG" dist/* --clobber
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site
      - name: Deploy signed repository
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
      - name: Mark release successfully published
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
        run: gh release edit "$RELEASE_TAG" --draft=false --latest
